<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0806">
<meta name="robots" content="noindex">
<title>La cosecha — moodboard</title>
<style>
:root{ --tinta:#0b0806; }
html{background:var(--tinta);-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(130% 90% at 50% 0%, #171008 0%, #070502 80%)}
.tablon{max-width:1600px;margin:0 auto;padding:14px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,44vw),1fr));
  grid-auto-rows:8px;grid-auto-flow:dense;gap:10px}
.pieza{position:relative;border-radius:6px;overflow:hidden;background:#0d0a07;
  box-shadow:0 4px 18px rgba(0,0,0,.5)}
.pieza img{width:100%;height:100%;object-fit:cover;display:block}
.pieza.real img{object-fit:contain}
/* respaldo si el navegador no soporta grid o falla el guion */
.simple{max-width:900px;margin:0 auto;padding:14px}
.simple img{width:100%;height:auto;display:block;margin:0 0 10px;border-radius:6px}
</style>
<div class="tablon" id="tablon"></div>
<script>
var DATA = __DATA__;
(function(){
  var ROW = 8, GAP = 10;
  var tablon = document.getElementById("tablon");

  function pinta(){
    var cols = getComputedStyle(tablon).gridTemplateColumns.split(" ").length;
    var colW = (tablon.clientWidth - 28 - GAP * (cols - 1)) / cols;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < DATA.length; i++){
      var d = DATA[i];
      var span = Math.min(d.span, cols);
      var wpx = span * colW + (span - 1) * GAP;
      var hpx = wpx * d.h / d.w;
      var rows = Math.max(6, Math.ceil((hpx + GAP) / (ROW + GAP)));
      var el = document.createElement("div");
      el.className = "pieza" + (d.real ? " real" : "");
      el.style.gridColumn = "span " + span;
      el.style.gridRow = "span " + rows;
      var img = document.createElement("img");
      img.src = d.src; img.alt = ""; img.width = d.w; img.height = d.h;
      img.loading = "lazy"; img.decoding = "async"; img.draggable = false;
      // si una foto no carga, su hueco desaparece en vez de dejar rota la maqueta
      img.onerror = (function(caja){ return function(){ caja.style.display = "none"; }; })(el);
      el.appendChild(img);
      frag.appendChild(el);
    }
    tablon.innerHTML = "";
    tablon.appendChild(frag);
  }

  function respaldo(){
    // ultimo recurso: columna simple, sin calculos
    try {
      var c = document.createElement("div");
      c.className = "simple";
      for (var i = 0; i < DATA.length; i++){
        var im = document.createElement("img");
        im.src = DATA[i].src; im.alt = ""; im.loading = "lazy";
        c.appendChild(im);
      }
      tablon.parentNode.replaceChild(c, tablon);
    } catch(e) {}
  }

  try { pinta(); } catch(e) { respaldo(); }

  // recalcula solo si cambia el ancho de maquetacion (ignora pinch-zoom y barra del navegador)
  var rt, lastW = document.documentElement.clientWidth;
  window.addEventListener("resize", function(){
    var w = document.documentElement.clientWidth;
    if (w === lastW) return;
    lastW = w;
    clearTimeout(rt);
    rt = setTimeout(function(){
      var y = window.scrollY;
      try { pinta(); } catch(e) {}
      window.scrollTo(0, y);
    }, 120);
  });
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
